<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Finder Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --nav: #1e293b; --accent: #38bdf8; --red: #ef4444; }
        body { margin: 0; padding: 0; background: var(--bg); color: white; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .fraud-alert { background: var(--red); padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Main Content */
        .content-view { flex: 1; display: none; padding: 15px; overflow-y: auto; }
        #view-home { display: block; padding: 0; }
        #map { height: 100%; width: 100%; }

        /* Bottom Navigation */
        .bottom-nav { background: var(--nav); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #334155; position: fixed; bottom: 0; width: 100%; }
        .nav-item { color: #94a3b8; font-size: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item span { font-size: 10px; }
        .nav-item.active { color: var(--accent); }

        .card { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Header with Fraud Alert -->
    <div class="header">
        <div class="fraud-alert" onclick="showFraud()"><i class="fa-solid fa-triangle-exclamation"></i> Fraud Alert!</div>
        <div><b>ShopFinder</b></div>
    </div>

    <!-- Home View -->
    <div id="view-home" class="content-view">
        <div id="map"></div>
    </div>

    <!-- Add Store View -->
    <div id="view-add" class="content-view">
        <h2>➕ Add Store</h2>
        <div class="card">
            <input type="text" placeholder="Store Name" style="width:100%; padding:10px; margin-bottom:10px; background:#0f172a; color:white; border:none; border-radius:8px;">
            <button style="width:100%; background:var(--accent); color:white; border:none; padding:10px; border-radius:8px;">Submit Store</button>
        </div>
    </div>

    <!-- Rating View -->
    <div id="view-ratings" class="content-view">
        <h2>⭐ Top Ratings</h2>
        <div class="card">Shop A: 4.8 <i class="fa-solid fa-star" style="color:gold;"></i></div>
        <div class="card">Shop B: 4.5 <i class="fa-solid fa-star" style="color:gold;"></i></div>
    </div>

    <!-- Trending View -->
    <div id="view-trending" class="content-view">
        <h2>🔥 Trending Shops</h2>
        <div class="card">🚀 New Grocery Store - 500+ visits</div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('view-home', this)"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" onclick="switchView('view-add', this)"><i class="fa-solid fa-plus"></i><span>Add</span></div>
        <div class="nav-item" onclick="switchView('view-ratings', this)"><i class="fa-solid fa-star"></i><span>Rating</span></div>
        <div class="nav-item" onclick="switchView('view-trending', this)"><i class="fa-solid fa-fire"></i><span>Trend</span></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function switchView(id, el) {
            document.querySelectorAll('.content-view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            el.classList.add('active');
            if(id === 'view-home') setTimeout(() => map.invalidateSize(), 100);
        }

        function showFraud() { alert("🚨 FRAUD ALERT: Aaj XYZ chowk par ek mobile shop par fake screen lagane ka scam hua hai. Savdhaan rahein!"); }

        // Map Init
        const map = L.map('map').setView([28.6139, 77.2090], 13);
        L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] }).addTo(map);
    </script>
</body>
</html>
