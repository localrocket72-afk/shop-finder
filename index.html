<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Finder Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 10px; }
        .header { text-align: center; padding: 10px; background: #1e293b; border-radius: 12px; margin-bottom: 10px; border: 1px solid #334155; }
        .header h1 { font-size: 20px; color: #38bdf8; }
        .search-bar { display: flex; gap: 6px; margin-bottom: 10px; }
        .search-bar input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
        .search-bar button { padding: 10px 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
        .btn { padding: 8px 12px; font-size: 12px; font-weight: bold; border: none; color: white; border-radius: 8px; cursor: pointer; }
        .btn-blue { background: #2563eb; } .btn-green { background: #10b981; } .btn-orange { background: #f59e0b; color: #000; }
        #map { height: 420px; width: 100%; border-radius: 12px; border: 1px solid #334155; margin-bottom: 10px; }
        .form-card { display: none; background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-top: 10px; }
        .form-card input, .form-card select { width: 100%; margin-bottom: 8px; padding: 10px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; }
        .popup-box { max-width: 220px; font-size: 11px; color: #1e293b; }
        .btn-gmap { background: #2563eb; color: white; text-decoration: none; display: block; text-align: center; padding: 6px; border-radius: 6px; margin-top: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📍 Shop Finder Pro</h1>
        <p style="font-size:11px; color:#94a3b8;">Google Maps Cloud App</p>
    </div>

    <div class="search-bar">
        <input type="text" id="citySearch" placeholder="Search city/area (e.g. Delhi)...">
        <button onclick="searchArea()">Search</button>
    </div>

    <div class="controls">
        <button class="btn btn-green" onclick="locateMe()">📍 My GPS</button>
        <button class="btn btn-orange" onclick="fetchShops()">⚡ Fetch Nearby Shops</button>
        <button class="btn btn-blue" onclick="toggleForm()">➕ Add Shop</button>
    </div>

    <div id="map"></div>

    <div id="addForm" class="form-card">
        <h3 style="color:#38bdf8; margin-bottom:10px;">➕ Add New Shop</h3>
        <input type="text" id="sName" placeholder="Shop Name *">
        <select id="sCat">
            <option value="General">Category</option>
            <option value="Grocery">Grocery</option>
            <option value="Restaurant">Restaurant</option>
            <option value="Electronics">Electronics</option>
            <option value="Pharmacy">Pharmacy</option>
        </select>
        <input type="text" id="sAddress" placeholder="Address">
        <input type="text" id="sLat" placeholder="Click Map for Latitude" readonly>
        <input type="text" id="sLng" placeholder="Click Map for Longitude" readonly>
        <button class="btn btn-blue" style="width:100%; padding:10px;" onclick="saveShop()">Save Shop</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, markersGroup;
        let localShops = JSON.parse(localStorage.getItem('my_shops') || '[]');

        function initMap() {
            if (!map) {
                map = L.map('map').setView([28.6139, 77.2090], 13);
                L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                    maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                }).addTo(map);

                markersGroup = L.layerGroup().addTo(map);

                map.on('click', (e) => {
                    document.getElementById('sLat').value = e.latlng.lat;
                    document.getElementById('sLng').value = e.latlng.lng;
                    alert("📍 Location Selected!");
                });
                renderShops([]);
            }
        }

        function locateMe() {
            initMap();
            navigator.geolocation.getCurrentPosition(pos => {
                const loc = [pos.coords.latitude, pos.coords.longitude];
                map.setView(loc, 15);
                L.marker(loc).addTo(map).bindPopup("<b>Aap Yahan Ho!</b>").openPopup();
                fetchShops();
            }, () => alert("GPS Enable Karein!"));
        }

        async function searchArea() {
            const q = document.getElementById('citySearch').value;
            if(!q) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}`);
            const data = await res.json();
            if(data.length > 0) {
                initMap();
                map.setView([data[0].lat, data[0].lon], 14);
                fetchShops();
            }
        }

        async function fetchShops() {
            initMap();
            const center = map.getCenter();
            const query = `[out:json];(node["shop"](around:1500,${center.lat},${center.lng});node["amenity"~"restaurant|cafe|pharmacy"](around:1500,${center.lat},${center.lng}););out body 30;`;
            try {
                const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
                const data = await res.json();
                const fetched = data.elements.map(item => ({
                    name: item.tags.name || "Local Shop",
                    cat: item.tags.shop || item.tags.amenity || "General",
                    lat: item.lat, lng: item.lon
                }));
                renderShops(fetched);
            } catch(e) {}
        }

        function renderShops(apiShops) {
            markersGroup.clearLayers();
            const all = [...localShops, ...apiShops];
            all.forEach(s => {
                const m = L.marker([s.lat, s.lng]);
                m.bindPopup(`
                    <div class="popup-box">
                        <h3>${s.name}</h3>
                        <p><b>Cat:</b> ${s.cat}</p>
                        <a class="btn-gmap" href="https://www.google.com/maps/@${s.lat},${s.lng},16z" target="_blank">🌐 Open Google Maps</a>
                    </div>
                `);
                markersGroup.addLayer(m);
            });
        }

        function toggleForm() {
            const f = document.getElementById('addForm');
            f.style.display = f.style.display === 'block' ? 'none' : 'block';
            initMap();
        }

        function saveShop() {
            const name = document.getElementById('sName').value;
            const cat = document.getElementById('sCat').value;
            const lat = document.getElementById('sLat').value;
            const lng = document.getElementById('sLng').value;
            if(!name || !lat) return alert("Pehle Map par click karke location chunein!");
            localShops.push({ name, cat, lat: parseFloat(lat), lng: parseFloat(lng) });
            localStorage.setItem('my_shops', JSON.stringify(localShops));
            alert("✅ Shop Saved!");
            toggleForm();
            renderShops([]);
        }

        window.onload = initMap;
    </script>
</body>
</html>
